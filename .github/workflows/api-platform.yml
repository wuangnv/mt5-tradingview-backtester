name: API platform contracts and builds
on:
  pull_request:
    paths: ['foundation_v2/**', 'scripts/restart_offline_api.ps1', '.github/workflows/api-platform.yml']
  push:
    paths: ['foundation_v2/**', 'scripts/restart_offline_api.ps1', '.github/workflows/api-platform.yml']
permissions:
  contents: read
jobs:
  bounded-local-contracts:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Locked Python environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --project foundation_v2
      - name: Frozen HTTP and stored-data schemas
        run: |
          foundation_v2/.venv/Scripts/python.exe -B foundation_v2/scripts/export_api_command_contracts.py --check
          foundation_v2/.venv/Scripts/python.exe -B foundation_v2/scripts/api_platform_openapi.py
          foundation_v2/.venv/Scripts/python.exe -B foundation_v2/api-rust/tests/export_prop_schemas.py --check
      - name: Worker, projection and restart/backup guards
        run: foundation_v2/.venv/Scripts/python.exe -B -m pytest foundation_v2/tests/test_api_command_worker.py foundation_v2/tests/test_api_platform_launcher.py foundation_v2/tests/test_api_platform_backup.py foundation_v2/tests/test_artifact_storage_architecture.py foundation_v2/tests/test_trades_page.py foundation_v2/tests/test_trades_page_performance.py -q
      - name: Rust locked build, tests and lint
        working-directory: foundation_v2/api-rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
      - name: Web locked build and transport/state tests
        working-directory: foundation_v2/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/scopedMutation.test.mjs tests/scopedRead.test.mjs tests/clientNavigation.test.mjs tests/workspaceEvents.test.mjs tests/chartAnnotations.test.mjs tests/dataDeskApi.test.mjs tests/sessionPicker.test.mjs tests/dashboardModel.test.mjs
          npm run build
