[project]
name = "trading-workspace-foundation-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pyarrow>=21,<22",
  "pydantic>=2.11,<3",
  "uvicorn>=0.53,<1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

